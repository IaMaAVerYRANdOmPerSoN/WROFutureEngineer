[CameraConfig]
OUTPUT_WIDTH = 512
OUTPUT_HEIGHT = 384
OUTPUT_CHANNELS = 3
EXECUTOR_THREADS = 3
MAX_CONCURRENT_CAPTURES = 3
BUFFER_COUNT = 1
HW_INIT_TIMEOUT = 5.0
CONFIGURE_TIMEOUT = 1.0
START_TIMEOUT = 1.0
CAPTURE_RETRY_SLEEP_SECONDS = 0.03
CAPTURE_ERROR_SLEEP_SECONDS = 0.01

[CameraConfig.FORMAT]
format = "BGR888"
size = [512, 384]

[CameraConfig.SENSOR_CONFIG]
output_size = [640, 480]
bit_depth = 10

[CameraConfig.CONTROLS_CONFIG]
FrameDurationLimits = [33333, 33333]
AeEnable = true

[ClientConfig]
SERIAL_PORT = "/dev/ttyACM0"
SERIAL_BAUD = 115200
SERIAL_TIMEOUT = 0.3
REQUEST_TIMEOUT = 2.0
WAIT_PATTERN = "WAITMS ([0-9]+)"
WAIT_RE_PATTERN = "WAITMS ([0-9]+)"
WAIT_RESPONSE_EXTRA_SECONDS = 1
TID_START = 1
TID_END = 500
WHEELBASE = 0.1
MAX_SPEED = 100
CONNECT_RETRIES = 5
CONNECT_RETRY_SLEEP_SECONDS = 0.5
SERVO_MIN_ANGLE = 0
SERVO_MAX_ANGLE = 180

[VisionConfig]
LOWER_BLACK = [0, 0, 0]
UPPER_BLACK = [179, 255, 70]
PERSPECTIVE_TRANSFORM = [
    [1, 0, 0],
    [0, 1, 0],
    [0, 0, 1]
]
# INITIAL_ROI, LEFT_WALL_ROI, RIGHT_WALL_ROI use np.s_, omited, defaults apply

[OpenChallengeConfig]
WALL_FOLLOW_KPKD = [0.50, 0.0]
CORNER_TURN_KPKD = [0.55, 0.0]
STRAIGHT_SPEED = -0.4
TURN_SPEED = -0.33
TURN_DURATION = 1.0
DRIVE_COMMAND_DURATION = 0.2
SHM_NAME = "camera_frame"
SHM_SIZE = 589824
TURN_HYSTERESIS = 6
LAP_LENGTH_IN_TURNS = 12
TURN_DETECTION_THRESHOLD = 0.1

[ObstacleChallengeConfig]
WALL_FOLLOW_KPKD = [1, 0.2]
CORNER_TURN_KPKD = [1.2, 0.2]
OBSTACLE_AVOID_KPKD = [0.8, 0.1]
STRAIGHT_SPEED = 0.5
TURN_SPEED = 0.4
HYBRID_SPEED = 0.4
DRIVE_COMMAND_DURATION = 0.1
SHM_NAME = "camera_frame"
SHM_SIZE = 589824
LAP_LENGTH_IN_TURNS = 12

[LiDARConfig]
SERIAL_PORT = "/dev/ttyAMA0"
SERIAL_BAUD = 230400
SERIAL_TIMEOUT = 0.1
PACKET_HEADER = 84
PACKET_VER_LEN = 44
PACKET_LEN = 47
