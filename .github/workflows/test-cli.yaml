name: Test piclient-cli

on: [push, pull_request]

jobs:
  test-cli:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies and activate venv
      run: |
        cd PiClient
        python -m venv .venv
        source .venv/bin/activate
        pip install ./piclient-cli ./piclient-core ./piclient-obstacle_challenge ./piclient-open_challenge

    - name: test piclient-cli
      run: |
        cd PiClient
        source .venv/bin/activate
        cd tests
        python -m unittest discover -s . -p "test_*.py"
