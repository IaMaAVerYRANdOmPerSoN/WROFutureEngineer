[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/piclient"]


[project]
name = "piclient"
version = "0.1.0"
authors = [
    { name = "Michael Xie", email = "wenmike.xie@gmail.com" },
    { name = "Elvis Wang" },
    { name = "Ryan Rao" },
]
description = "Apostla team WRO FE 2026 shared library"

requires-python = ">=3.13"
dependencies = [
    "aioserial>=1.3.1",
    "colorama>=0.4.6",
    "loguru>=0.7.3",
    "numpy>=2.4.0",
    "opencv-python>=4.13.0.92",
    "pyserial>=3.5",
    "scipy>=1.17.1",
    "win32_setctime>=1.2.0",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


[project.optional-dependencies]
cli = ["piclient-cli"]
open_challenge = ["piclient-open_challenge"]
obstacle_challenge = ["piclient-obstacle_challenge"]
all = ["piclient-cli", "piclient-open_challenge", "piclient-obstacle_challenge"]